# Contrato del servicio reservas: Cancelar una reserva (devuelve los asientos al vuelo)
summary: "Cancelar una reserva (devuelve los asientos al vuelo)"
tags: [Reservas]
security: [{Bearer: []}]
produces: [application/json, application/xml]
parameters:
  - {in: path, name: reserva_id, type: integer, required: true}
responses:
  200:
    description: Reserva cancelada (no se borra, queda con estado cancelada).
  400:
    description: El vuelo ya partió.
  401:
    description: Sin token o sesión cerrada.
  404:
    description: La reserva no existe o pertenece a otro usuario.
  409:
    description: La reserva ya estaba cancelada.
